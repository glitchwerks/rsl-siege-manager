[project]
name = "rsl-siege-manager-backend"
# This project is not packaged; the deployed component version lives in VERSION.
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "httpx>=0.27",
    "playwright>=1.49",
    "pyjwt>=2.9",
    "cryptography>=43",
    "azure-monitor-opentelemetry>=1.6",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "opentelemetry-instrumentation-asyncpg>=0.50b0",
    "slowapi>=0.1.9,<0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "black>=24.10",
    "ruff>=0.8",
    "aiosqlite>=0.20",
    "respx>=0.21",
]

[tool.uv]
package = false
required-version = "==0.11.28"

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
alembic/versions/.*\.py
'''

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Set log_level so pytest's catching_logs fixture explicitly initialises the
# caplog handler and root logger to WARNING for every test.  Without this,
# catching_logs receives level=None and skips the setLevel/setLevel calls,
# which leaves the handler uninitialised on Python 3.12 + Linux (CI) in a
# way that prevents caplog from capturing WARNING records from child loggers
# (e.g. app.rate_limit) even when caplog.at_level() is used inside the test.
log_level = "WARNING"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]
