name: Portable configuration
on:
  pull_request:
    paths: ["deploy/portable/**", "scripts/portable-preflight.py", "scripts/tests/test_portable_preflight.py", "scripts/portable-db-bootstrap-readiness.py", "scripts/tests/test_portable_db_bootstrap_readiness.py", "scripts/portable-pilot.py", "scripts/tests/test_portable_pilot.py", "scripts/portable-monitor.py", "scripts/tests/test_portable_monitor.py", "scripts/portable-integration.py", "scripts/tests/test_portable_integration.py", ".github/workflows/portable-config.yml"]
  push:
    branches: [main]
    paths: ["deploy/portable/**", "scripts/portable-preflight.py", "scripts/tests/test_portable_preflight.py", "scripts/portable-db-bootstrap-readiness.py", "scripts/tests/test_portable_db_bootstrap_readiness.py", "scripts/portable-pilot.py", "scripts/tests/test_portable_pilot.py", "scripts/portable-monitor.py", "scripts/tests/test_portable_monitor.py", "scripts/portable-integration.py", "scripts/tests/test_portable_integration.py", ".github/workflows/portable-config.yml"]
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate both topologies without activating services
        env:
          PORTABLE_COMPOSE_TEST: "1"
        run: python3 -m unittest discover -s scripts/tests -p test_portable_preflight.py -v
      - name: Validate new-instance database proof behavior
        run: python3 -m unittest discover -s scripts/tests -p test_portable_db_bootstrap_readiness.py -v
      - name: Verify read-only pilot observation with synthetic containers and mocked HTTPS
        env:
          PORTABLE_PILOT_TEST: "1"
        run: python3 -m unittest discover -s scripts/tests -p test_portable_pilot.py -v
      - name: Verify independent signal safety without live notifications
        run: python3 -m unittest discover -s scripts/tests -p test_portable_monitor.py -v
      - name: Verify isolated sidecar smoke without network or Discord writes
        run: python3 -m unittest discover -s scripts/tests -p test_portable_integration.py -v
      - name: Verify database bootstrap and separate application roles
        # Disposable CI runner only; never invokes application/bot containers.
        shell: bash
        run: |
          set -euo pipefail
          container="portable-db-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          partial="${container}-partial"
          evidence_root="$(mktemp -d)"
          trap 'docker rm -f "$container" "$partial" >/dev/null 2>&1 || true; rm -rf "$evidence_root"' EXIT
          project="portable_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          printf 'COMPOSE_PROJECT_NAME=%s\n' "$project" > "$evidence_root/stack.env"
          chmod 600 "$evidence_root/stack.env"
          docker run -d --name "$container" \
            --label "com.docker.compose.project=$project" \
            --label 'com.docker.compose.service=postgres' \
            --health-cmd 'pg_isready -h 127.0.0.1 -U postgres -d postgres' \
            --health-interval 2s \
            -e POSTGRES_PASSWORD=synthetic-admin-password-long-enough \
            -e SIEGE_DB_PASSWORD=synthetic-siege-password-long-enough \
            -e MOM_DB_PASSWORD=synthetic-mom-password-long-enough \
            -v "$PWD/deploy/portable/init-databases.sql:/docker-entrypoint-initdb.d/10-applications.sql:ro" \
            postgres:16 >/dev/null
          ready=false
          for attempt in {1..60}; do
            if docker exec -e PGPASSWORD=synthetic-admin-password-long-enough "$container" psql -h 127.0.0.1 -U postgres -d postgres -tAc \
              "SELECT count(*) FROM pg_database WHERE datname IN ('siege','mom_bot')" 2>/dev/null | grep -qx '2'; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          for spec in 'siege_app siege synthetic-siege-password-long-enough mom_bot' 'mom_app mom_bot synthetic-mom-password-long-enough siege'; do
            read -r role database password other <<< "$spec"
            test "$(docker exec -e PGPASSWORD="$password" "$container" psql -h 127.0.0.1 -U "$role" -d "$database" -tAc 'SELECT 1')" = 1
            test "$(docker exec "$container" psql -U postgres -d postgres -tAc "SELECT NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole FROM pg_roles WHERE rolname='$role'")" = t
            if docker exec -e PGPASSWORD="$password" "$container" psql -h 127.0.0.1 -U "$role" -d "$other" -tAc 'SELECT 1' >/dev/null 2>&1; then
              echo 'Cross-application database isolation failed'
              exit 1
            fi
          done
          for attempt in {1..30}; do
            if test "$(docker inspect -f '{{.State.Health.Status}}' "$container")" = healthy; then
              break
            fi
            sleep 1
          done
          python3 scripts/portable-db-bootstrap-readiness.py \
            --project-directory "$evidence_root" --report "$evidence_root/complete.json"
          python3 -c 'import json,sys; report=json.load(open(sys.argv[1])); assert report["status"] == "PASS" and all(report["checks"].values())' "$evidence_root/complete.json"
          docker run -d --name "$partial" \
            --label "com.docker.compose.project=${project}_partial" \
            --label 'com.docker.compose.service=postgres' \
            --health-cmd 'pg_isready -h 127.0.0.1 -U postgres -d postgres' \
            --health-interval 2s \
            -e POSTGRES_PASSWORD=synthetic-admin-password-long-enough postgres:16 >/dev/null
          for attempt in {1..60}; do
            if docker exec "$partial" pg_isready -h 127.0.0.1 -U postgres -d postgres >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec "$partial" psql -U postgres -d postgres -c \
            'CREATE ROLE siege_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE' >/dev/null
          docker exec "$partial" psql -U postgres -d postgres -c \
            'CREATE DATABASE siege OWNER siege_app' >/dev/null
          for attempt in {1..30}; do
            if test "$(docker inspect -f '{{.State.Health.Status}}' "$partial")" = healthy; then
              break
            fi
            sleep 1
          done
          printf 'COMPOSE_PROJECT_NAME=%s\n' "${project}_partial" > "$evidence_root/stack.env"
          if python3 scripts/portable-db-bootstrap-readiness.py \
            --project-directory "$evidence_root" --report "$evidence_root/partial.json"; then
            echo 'Partial database bootstrap unexpectedly passed'
            exit 1
          fi
          python3 -c 'import json,sys; checks=json.load(open(sys.argv[1]))["checks"]; assert checks["single_healthy_postgres"] and checks["only_postgres_running"] and not checks["mom_app_least_privilege"]' "$evidence_root/partial.json"
