name: Publish portable images

# CI on main is the only producer. A tag, PR, or manual dispatch cannot publish
# an untested image. This workflow is independent of the disabled Azure Deploy.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: portable-images-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: siege-api
            context: backend
          - name: siege-frontend
            context: frontend
          - name: siege-bot
            context: bot
    steps:
      - name: Check out CI-approved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set artifact version
        id: version
        env:
          BUILD_NUMBER: ${{ github.event.workflow_run.run_number }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          base=$(node -p "require('./frontend/package.json').version")
          short=${SOURCE_SHA:0:7}
          echo "frontend=${base}+${BUILD_NUMBER}.${short}" >> "$GITHUB_OUTPUT"

      - name: Stage frontend changelog
        if: matrix.name == 'siege-frontend'
        run: cp CHANGELOG.md frontend/CHANGELOG.md

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sign in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable SHA tag
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: ghcr.io/glitchwerks/${{ matrix.name }}:${{ github.event.workflow_run.head_sha }}
          build-args: |
            GIT_SHA=${{ github.event.workflow_run.head_sha }}
            BUILD_NUMBER=${{ github.event.workflow_run.run_number }}
            FRONTEND_VERSION=${{ steps.version.outputs.frontend }}
            VITE_APP_VERSION=${{ steps.version.outputs.frontend }}

      - name: Report digest
        env:
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          printf '%s\n' "ghcr.io/glitchwerks/${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
