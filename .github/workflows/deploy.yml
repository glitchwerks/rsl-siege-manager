name: Deploy

# ── Triggers ───────────────────────────────────────────────────────────────────
#
# push to main          → CI tests + build images + deploy to dev only.
#
# push a v* tag         → wait for all matching SHA-tagged images, then deploy
#                         them to prod. The images are built when the tagged
#                         commit is merged to main, but that independent run
#                         may still be publishing when the release tag arrives.
#                         Tag creation IS the human approval step — no GitHub
#                         environment gate is needed.
#
# workflow_dispatch     → manual escape hatch. Choose dev or prod and,
#                         optionally, supply an explicit SHA tag to deploy.
#                         Leave image_tag blank to deploy the current HEAD SHA.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      image_tag:
        description: 'SHA tag to deploy (leave blank to use HEAD sha)'
        required: false
        default: ''
        type: string

# ── Concurrency ────────────────────────────────────────────────────────────────
#
# Main-push runs use a unique group per SHA. Every merged commit must publish
# its immutable images because an automatic infra deployment may be waiting for
# that exact SHA before applying Bicep. The dev deployment jobs below use their
# own replacement groups so only the newest eligible application revision wins.
#
# Tag-triggered runs get a unique group per tag (`deploy-tag-refs/tags/v1.2.3`)
# so two different tags never cancel each other — each prod deploy completes
# independently.
#
# workflow_dispatch runs each get a unique group (run_id) so manual re-runs
# are never cancelled by each other.

# ── Permissions ────────────────────────────────────────────────────────────────
#
# pull-requests: write is required because the reusable ci.yml workflow
# declares that permission (for its on-failure PR comment steps). GitHub
# constrains a called workflow's permissions to the caller's grant, so
# deploy.yml must include it even though the deploy pipeline itself never
# writes to pull requests (the comment steps in ci.yml are gated on
# github.event_name == 'pull_request' and will never fire here).
#
# contents: write and actions: read are also required because ci.yml
# declares them. GitHub enforces that callers must hold at least every
# permission the called (reusable) workflow declares — even if deploy.yml
# itself never exercises those permissions directly.

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: >-
    ${{
      github.ref_type == 'tag' && format('deploy-tag-{0}', github.ref) ||
      github.event_name == 'workflow_dispatch' && github.run_id ||
      format('deploy-main-build-{0}', github.sha)
    }}
  cancel-in-progress: false

jobs:

# ── CI ─────────────────────────────────────────────────────────────────────────
#
# Run tests only on pushes to main (not on tag pushes or manual dispatches).
# The commit was already tested when it landed on main; tags just promote the
# pre-validated image. Infra CI runs as part of infra-deploy.yml — it is no
# longer needed here.

  run-ci:
    name: Run Tests
    if: github.ref_type == 'branch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

# ── Build ──────────────────────────────────────────────────────────────────────
#
# Three image builds run in parallel via matrix. Each leg logs into Azure
# using the dev environment's AZURE_CREDENTIALS (AcrPush is needed; the dev
# service principal works because ACR is shared across environments).
# `az acr login` authenticates Docker — no separate ACR_USERNAME/PASSWORD
# secrets are required.
#
# Images are tagged with the commit SHA only (no :latest). Immutable SHA tags
# are the foundation of the promotion model: the exact bytes built here are
# what gets deployed to dev and later promoted unchanged to prod via a v* tag.
#
# Each image is pushed to both the dev ACR (vars.ACR_LOGIN_SERVER) and the
# prod ACR (vars.PROD_ACR_LOGIN_SERVER) so that prod deploys can pull the
# same immutable SHA without a separate build step. The prod push is guarded
# by `if: vars.PROD_ACR_NAME != ''` so dev-only setups are unaffected.
#
# This job runs only on main-branch pushes (after CI passes). Tag-triggered
# and workflow_dispatch runs skip it because the image already exists in ACR.

  build-and-push:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch' && github.ref == 'refs/heads/main'
    needs: run-ci
    environment: dev

    strategy:
      fail-fast: true
      matrix:
        include:
          - service: siege-api
            context: ./backend
          - service: siege-frontend
            context: ./frontend
          - service: siege-bot
            context: ./bot

    steps:
      - name: Validate required variables
        run: |
          missing=()
          [[ -z "${{ vars.ACR_NAME }}" ]]          && missing+=("ACR_NAME")
          [[ -z "${{ vars.ACR_LOGIN_SERVER }}" ]]  && missing+=("ACR_LOGIN_SERVER")
          [[ -z "${{ vars.RESOURCE_GROUP }}" ]]    && missing+=("RESOURCE_GROUP")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "❌ Missing required GitHub Actions environment variables:"
            printf '   - %s\n' "${missing[@]}"
            echo ""
            echo "Set these under: GitHub → Settings → Environments → dev → Variables"
            exit 1
          fi
          echo "✅ All required variables present"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Authenticate Docker to ACR via the Azure CLI — the service principal
      # in AZURE_CREDENTIALS needs AcrPush on the registry (or Contributor
      # on the resource group).
      - name: Log in to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      # CHANGELOG.md lives at the repo root, outside the ./frontend build context.
      # Stage it in so the changelog-plugin can resolve it inside Docker.
      # (Only needed for the frontend image; the other matrix legs are unaffected.)
      - name: Stage CHANGELOG.md into frontend build context
        if: matrix.service == 'siege-frontend'
        run: cp CHANGELOG.md frontend/CHANGELOG.md

      - name: Build and push ${{ matrix.service }}
        run: |
          IMAGE=${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.service }}
          BUILD_NUM=${{ github.run_number }}
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          FRONTEND_BASE_VER=$(node -p "require('./frontend/package.json').version")
          FRONTEND_VERSION="${FRONTEND_BASE_VER}+${BUILD_NUM}.${SHORT_SHA}"

          # The frontend bakes VITE_APP_VERSION into the JS bundle at build time
          # (Vite replaces import.meta.env.VITE_APP_VERSION statically).
          # The API receives the same value as FRONTEND_VERSION so /api/version
          # can report the exact frontend artifact built from this commit.
          if [ "${{ matrix.service }}" = "siege-frontend" ]; then
            VITE_APP_VERSION="$FRONTEND_VERSION"
          else
            VITE_APP_VERSION="unused"
          fi

          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            --build-arg BUILD_NUMBER=${BUILD_NUM} \
            --build-arg FRONTEND_VERSION=${FRONTEND_VERSION} \
            --build-arg VITE_APP_VERSION=${VITE_APP_VERSION} \
            -t "${IMAGE}:${{ github.sha }}" \
            ${{ matrix.context }}
          docker push "${IMAGE}:${{ github.sha }}"

      - name: Clean up staged CHANGELOG.md
        if: matrix.service == 'siege-frontend' && always()
        run: rm -f frontend/CHANGELOG.md

      - name: Push to prod ACR
        if: vars.PROD_ACR_NAME != ''
        run: |
          az acr login --name ${{ vars.PROD_ACR_NAME }}
          PROD_IMAGE=${{ vars.PROD_ACR_LOGIN_SERVER }}/${{ matrix.service }}
          docker tag ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ github.sha }} "${PROD_IMAGE}:${{ github.sha }}"
          docker push "${PROD_IMAGE}:${{ github.sha }}"

# ── Select latest dev revision ───────────────────────────────────────────────
#
# Every main commit publishes immutable images, but an older build can finish
# after a newer one. Only the current main SHA may enter the ordinary dev deploy
# path. Per-service concurrency below handles a newer merge that arrives after
# this check by replacing the older in-progress deployment.

  select-latest-dev:
    name: Select latest dev revision
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch' && github.ref == 'refs/heads/main'
    outputs:
      deploy: ${{ steps.latest.outputs.deploy }}

    steps:
      - name: Compare commit with main
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$GITHUB_SHA" == "$latest_sha" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "${GITHUB_SHA} is the current main revision"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale dev deploy for ${GITHUB_SHA}; main is ${latest_sha}"
          fi

# ── Deploy API (dev) ───────────────────────────────────────────────────────────
#
# Migrations run automatically inside the container via entrypoint.sh
# (alembic upgrade head → uvicorn). No separate migration job needed.
#
# vars.RESOURCE_GROUP is an environment-scoped variable (not a secret).
# GitHub resolves the correct value per environment automatically:
#   dev  → siege-web-dev
#   prod → siege-web-prod

  deploy-api-dev:
    name: Deploy API (dev)
    needs:
      - build-and-push
      - select-latest-dev
    runs-on: ubuntu-latest
    if: needs.select-latest-dev.outputs.deploy == 'true'
    environment: dev
    concurrency:
      group: deploy-api-dev
      cancel-in-progress: true

    steps:
      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy siege-web-api-dev
        uses: azure/container-apps-deploy-action@8dff69dac3367c32ceb2690d8f13adbeab462703 # v2
        with:
          resourceGroup: ${{ vars.RESOURCE_GROUP }}
          containerAppName: siege-web-api-dev
          imageToDeploy: ${{ vars.ACR_LOGIN_SERVER }}/siege-api:${{ github.sha }}

# ── Deploy frontend & bot (dev) ────────────────────────────────────────────────
#
# Frontend and bot deploy in parallel after the API is up. Migrations run
# inside the API container on startup — no separate migration step needed.

  deploy-frontend-dev:
    name: Deploy Frontend (dev)
    needs: deploy-api-dev
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch' && github.ref == 'refs/heads/main'
    environment: dev
    concurrency:
      group: deploy-frontend-dev
      cancel-in-progress: true

    steps:
      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy siege-web-frontend-dev
        uses: azure/container-apps-deploy-action@8dff69dac3367c32ceb2690d8f13adbeab462703 # v2
        with:
          resourceGroup: ${{ vars.RESOURCE_GROUP }}
          containerAppName: siege-web-frontend-dev
          imageToDeploy: ${{ vars.ACR_LOGIN_SERVER }}/siege-frontend:${{ github.sha }}

  deploy-bot-dev:
    name: Deploy Bot (dev)
    needs: deploy-api-dev
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch' && github.ref == 'refs/heads/main'
    environment: dev
    concurrency:
      group: deploy-bot-dev
      cancel-in-progress: true

    steps:
      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy siege-web-bot-dev
        uses: azure/container-apps-deploy-action@8dff69dac3367c32ceb2690d8f13adbeab462703 # v2
        with:
          resourceGroup: ${{ vars.RESOURCE_GROUP }}
          containerAppName: siege-web-bot-dev
          imageToDeploy: ${{ vars.ACR_LOGIN_SERVER }}/siege-bot:${{ github.sha }}

  verify-dev-deployment:
    name: Verify dev deployment versions
    needs:
      - deploy-frontend-dev
      - deploy-bot-dev
    runs-on: ubuntu-latest
    if: |
      needs.deploy-frontend-dev.result == 'success' &&
      needs.deploy-bot-dev.result == 'success'
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify health and component versions
        env:
          PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL }}
          EXPECTED_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/verify-deployed-versions.py \
            --url "$PUBLIC_URL" \
            --expected-sha "$EXPECTED_SHA" \
            --latest-sha-url "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main"

# ── Verify production images ──────────────────────────────────────────────────
#
# A release tag can be pushed before the independent main-branch workflow has
# finished publishing all three images. Wait for the exact SHA tag in prod ACR
# so a green deployment can never silently retain a stale image.

  verify-prod-images:
    name: Verify production images
    runs-on: ubuntu-latest
    if: |
      (github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod')
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Wait for exact release images
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          ./scripts/wait-for-acr-images.sh \
            "$ACR_NAME" \
            "$IMAGE_TAG" \
            siege-api siege-frontend siege-bot

# ── Deploy API (prod) ──────────────────────────────────────────────────────────
#
# Triggered by a v* tag push or a manual workflow_dispatch targeting prod.
# Production does not depend on a dev deployment, but it does require the image
# availability gate above to prove that the exact release artifacts exist.
#
# The image SHA is resolved as:
#   tag push          → github.sha   (the commit the tag points at; built
#                                     when that commit was merged to main)
#   workflow_dispatch → inputs.image_tag if supplied, otherwise github.sha
#
# Tag creation is the human approval step. The GitHub "prod" environment no
# longer needs a Required Reviewers gate.

  deploy-api-prod:
    name: Deploy API (prod)
    needs: verify-prod-images
    runs-on: ubuntu-latest
    if: |
      needs.verify-prod-images.result == 'success' && (
        (github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod')
      )
    environment: prod

    steps:
      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy siege-web-api-prod
        uses: azure/container-apps-deploy-action@8dff69dac3367c32ceb2690d8f13adbeab462703 # v2
        with:
          resourceGroup: ${{ vars.RESOURCE_GROUP }}
          containerAppName: siege-web-api-prod
          imageToDeploy: ${{ vars.ACR_LOGIN_SERVER }}/siege-api:${{ inputs.image_tag || github.sha }}

# ── Deploy frontend & bot (prod) ───────────────────────────────────────────────
#
# Frontend and bot deploy in parallel after the prod API is up.
# Migrations run inside the API container on startup via entrypoint.sh.

  deploy-frontend-prod:
    name: Deploy Frontend (prod)
    needs: deploy-api-prod
    runs-on: ubuntu-latest
    if: |
      always() && (
        (github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod')
      )
    environment: prod

    steps:
      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy siege-web-frontend-prod
        uses: azure/container-apps-deploy-action@8dff69dac3367c32ceb2690d8f13adbeab462703 # v2
        with:
          resourceGroup: ${{ vars.RESOURCE_GROUP }}
          containerAppName: siege-web-frontend-prod
          imageToDeploy: ${{ vars.ACR_LOGIN_SERVER }}/siege-frontend:${{ inputs.image_tag || github.sha }}

  deploy-bot-prod:
    name: Deploy Bot (prod)
    needs: deploy-api-prod
    runs-on: ubuntu-latest
    if: |
      always() && (
        (github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod')
      )
    environment: prod

    steps:
      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy siege-web-bot-prod
        uses: azure/container-apps-deploy-action@8dff69dac3367c32ceb2690d8f13adbeab462703 # v2
        with:
          resourceGroup: ${{ vars.RESOURCE_GROUP }}
          containerAppName: siege-web-bot-prod
          imageToDeploy: ${{ vars.ACR_LOGIN_SERVER }}/siege-bot:${{ inputs.image_tag || github.sha }}

# ── Verify production deployment ──────────────────────────────────────────────
#
# Container Apps can finish updating shortly after the deploy action returns.
# Poll the public endpoint and fail unless it becomes healthy on the exact
# release SHA. Component-version completeness is tracked separately in #311.

  verify-prod-deployment:
    name: Verify production deployment
    needs:
      - deploy-frontend-prod
      - deploy-bot-prod
    runs-on: ubuntu-latest
    if: |
      needs.deploy-frontend-prod.result == 'success' &&
      needs.deploy-bot-prod.result == 'success' && (
        (github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod')
      )
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.image_tag || github.sha }}
          persist-credentials: false

      - name: Verify health and component versions
        env:
          PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL }}
          EXPECTED_SHA: ${{ inputs.image_tag || github.sha }}
        run: |
          python scripts/verify-deployed-versions.py \
            --url "$PUBLIC_URL" \
            --expected-sha "$EXPECTED_SHA"
