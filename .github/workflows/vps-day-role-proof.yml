name: VPS day-role proof

# Reads protected backup and same-copy restore evidence after an independently
# confirmed maintenance drain. It does not change runtime or Discord roles.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Protected deployment target
        required: true
        default: rehearsal
        type: choice
        options:
          - rehearsal
          - production
      source_sha:
        description: Exact reviewed source SHA used for the stage
        required: true
        type: string
      stage_id:
        description: Exact UUID returned by the reviewed stage
        required: true
        type: string
      maintenance_kind:
        description: Successful maintenance report stored in the exact stage
        required: true
        type: choice
        options:
          - pause
          - drain
      backup_report:
        description: Exact protected managed backup job.json path
        required: true
        type: string
      recover_report:
        description: Exact protected off-host recovery report path
        required: true
        type: string
      restore_report:
        description: Exact protected isolated restore report path
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vps-production-promotion
  cancel-in-progress: false

jobs:
  proof:
    if: github.ref == 'refs/heads/main' && (inputs.target == 'rehearsal' || inputs.target == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: ${{ inputs.target == 'rehearsal' && 'vps-rehearsal' || 'vps-prod' }}
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require the staged source to be reviewed main history
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD

      - name: Join tailnet as ephemeral deployment runner
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets[inputs.target == 'rehearsal' && 'REHEARSAL_TAILSCALE_OAUTH_CLIENT_ID' || 'TAILSCALE_OAUTH_CLIENT_ID'] }}
          oauth-secret: ${{ secrets[inputs.target == 'rehearsal' && 'REHEARSAL_TAILSCALE_OAUTH_SECRET' || 'TAILSCALE_OAUTH_SECRET'] }}
          tags: ${{ inputs.target == 'rehearsal' && 'tag:github-rehearsal' || 'tag:github-deploy' }}

      - name: Verify exact stage and same-copy evidence through restricted SSH command
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          STAGE_ID: ${{ inputs.stage_id }}
          MAINTENANCE_KIND: ${{ inputs.maintenance_kind }}
          BACKUP_REPORT: ${{ inputs.backup_report }}
          RECOVER_REPORT: ${{ inputs.recover_report }}
          RESTORE_REPORT: ${{ inputs.restore_report }}
          VPS_TAILSCALE_HOST: ${{ secrets[inputs.target == 'rehearsal' && 'REHEARSAL_VPS_TAILSCALE_HOST' || 'VPS_TAILSCALE_HOST'] }}
          VPS_SSH_USER: ${{ vars[inputs.target == 'rehearsal' && 'REHEARSAL_VPS_SSH_USER' || 'VPS_SSH_USER'] }}
          VPS_SSH_HOST_FINGERPRINT: ${{ secrets[inputs.target == 'rehearsal' && 'REHEARSAL_VPS_SSH_HOST_FINGERPRINT' || 'VPS_SSH_HOST_FINGERPRINT'] }}
          VPS_DEPLOY_SSH_KEY: ${{ secrets[inputs.target == 'rehearsal' && 'REHEARSAL_VPS_DEPLOY_SSH_KEY' || 'VPS_DEPLOY_SSH_KEY'] }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets[inputs.target == 'rehearsal' && 'REHEARSAL_VPS_SSH_KNOWN_HOSTS' || 'VPS_SSH_KNOWN_HOSTS'] }}
        run: |
          python3 scripts/portable-vps-day-role-proof-dispatch.py \
            --source-sha "$SOURCE_SHA" --stage-id "$STAGE_ID" \
            --maintenance-kind "$MAINTENANCE_KIND" \
            --backup-report "$BACKUP_REPORT" --recover-report "$RECOVER_REPORT" \
            --restore-report "$RESTORE_REPORT" \
            --report "$RUNNER_TEMP/vps-day-role-proof-report.json"

      - name: Upload sanitized proof report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vps-day-role-proof-report
          path: ${{ runner.temp }}/vps-day-role-proof-report.json
          if-no-files-found: ignore
          retention-days: 30
