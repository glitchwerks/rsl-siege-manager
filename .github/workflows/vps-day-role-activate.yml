name: VPS day-role activate

# A single, explicitly approved backend-only configuration activation. The
# protected environment must carry the matching full deployment window ID.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Protected deployment target
        required: true
        default: rehearsal
        type: choice
        options:
          - rehearsal
          - production
      stage_id:
        description: Exact accepted stage UUID
        required: true
        type: string
      proof_sha256:
        description: SHA-256 from the accepted backup proof report
        required: true
        type: string
      preflight_sha256:
        description: SHA-256 from the accepted preflight report
        required: true
        type: string
      window_id:
        description: Separately approved full deployment window ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vps-production-promotion
  cancel-in-progress: false

jobs:
  activate:
    if: github.ref == 'refs/heads/main' && (inputs.target == 'rehearsal' || inputs.target == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.target == 'rehearsal' && 'vps-rehearsal' || 'vps-prod' }}
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require separately approved full deployment window
        env:
          WINDOW_ID: ${{ inputs.window_id }}
          APPROVED_WINDOW_ID: ${{ vars[inputs.target == 'rehearsal' && 'REHEARSAL_VPS_DAY_ROLE_WINDOW_ID' || 'VPS_DAY_ROLE_WINDOW_ID'] }}
        run: |
          set -euo pipefail
          [[ "$WINDOW_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{3,63}$ ]]
          test -n "$APPROVED_WINDOW_ID"
          test "$WINDOW_ID" = "$APPROVED_WINDOW_ID"

      - name: Join tailnet as ephemeral deployment runner
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets[inputs.target == 'rehearsal' && 'REHEARSAL_TAILSCALE_OAUTH_CLIENT_ID' || 'TAILSCALE_OAUTH_CLIENT_ID'] }}
          oauth-secret: ${{ secrets[inputs.target == 'rehearsal' && 'REHEARSAL_TAILSCALE_OAUTH_SECRET' || 'TAILSCALE_OAUTH_SECRET'] }}
          tags: ${{ inputs.target == 'rehearsal' && 'tag:github-rehearsal' || 'tag:github-deploy' }}

      - name: Activate only in the matching protected window
        env:
          SOURCE_SHA: ${{ github.sha }}
          STAGE_ID: ${{ inputs.stage_id }}
          PROOF_SHA256: ${{ inputs.proof_sha256 }}
          PREFLIGHT_SHA256: ${{ inputs.preflight_sha256 }}
          WINDOW_ID: ${{ inputs.window_id }}
          VPS_APPROVED_DAY_ROLE_WINDOW_ID: ${{ vars[inputs.target == 'rehearsal' && 'REHEARSAL_VPS_DAY_ROLE_WINDOW_ID' || 'VPS_DAY_ROLE_WINDOW_ID'] }}
          VPS_PUBLIC_SIGNAL_CONFIG_PATH: ${{ vars[inputs.target == 'rehearsal' && 'REHEARSAL_VPS_PUBLIC_SIGNAL_CONFIG_PATH' || 'VPS_PUBLIC_SIGNAL_CONFIG_PATH'] }}
          VPS_TAILSCALE_HOST: ${{ secrets[inputs.target == 'rehearsal' && 'REHEARSAL_VPS_TAILSCALE_HOST' || 'VPS_TAILSCALE_HOST'] }}
          VPS_SSH_USER: ${{ vars[inputs.target == 'rehearsal' && 'REHEARSAL_VPS_SSH_USER' || 'VPS_SSH_USER'] }}
          VPS_SSH_HOST_FINGERPRINT: ${{ secrets[inputs.target == 'rehearsal' && 'REHEARSAL_VPS_SSH_HOST_FINGERPRINT' || 'VPS_SSH_HOST_FINGERPRINT'] }}
          VPS_DEPLOY_SSH_KEY: ${{ secrets[inputs.target == 'rehearsal' && 'REHEARSAL_VPS_DEPLOY_SSH_KEY' || 'VPS_DEPLOY_SSH_KEY'] }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets[inputs.target == 'rehearsal' && 'REHEARSAL_VPS_SSH_KNOWN_HOSTS' || 'VPS_SSH_KNOWN_HOSTS'] }}
        run: |
          python3 scripts/portable-vps-day-role-activate-dispatch.py \
            --source-sha "$SOURCE_SHA" --stage-id "$STAGE_ID" \
            --proof-sha256 "$PROOF_SHA256" --preflight-sha256 "$PREFLIGHT_SHA256" \
            --window-id "$WINDOW_ID" \
            --report "$RUNNER_TEMP/vps-day-role-activate-report.json"

      - name: Upload sanitized activation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vps-day-role-activate-report
          path: ${{ runner.temp }}/vps-day-role-activate-report.json
          if-no-files-found: ignore
          retention-days: 30
