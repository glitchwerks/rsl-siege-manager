name: VPS day-role stage

# Stores one reviewed, private configuration candidate. It does not update
# runtime files, containers, database rows, or Discord roles.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Protected deployment target
        required: true
        default: rehearsal
        type: choice
        options:
          - rehearsal
          - production
      stage_id:
        description: Exact UUID for this single-use configuration stage
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vps-production-promotion
  cancel-in-progress: false

jobs:
  stage:
    if: github.ref == 'refs/heads/main' && (inputs.target == 'rehearsal' || inputs.target == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.target == 'rehearsal' && 'vps-rehearsal' || 'vps-prod' }}
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Join tailnet as ephemeral deployment runner
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets[inputs.target == 'rehearsal' && 'REHEARSAL_TAILSCALE_OAUTH_CLIENT_ID' || 'TAILSCALE_OAUTH_CLIENT_ID'] }}
          oauth-secret: ${{ secrets[inputs.target == 'rehearsal' && 'REHEARSAL_TAILSCALE_OAUTH_SECRET' || 'TAILSCALE_OAUTH_SECRET'] }}
          tags: ${{ inputs.target == 'rehearsal' && 'tag:github-rehearsal' || 'tag:github-deploy' }}

      - name: Stage private decision through restricted SSH command
        env:
          SOURCE_SHA: ${{ github.sha }}
          STAGE_ID: ${{ inputs.stage_id }}
          VPS_DAY_ROLE_DECISION_JSON: ${{ secrets[inputs.target == 'rehearsal' && 'REHEARSAL_DAY_ROLE_DECISION_JSON' || 'DAY_ROLE_DECISION_JSON'] }}
          VPS_TAILSCALE_HOST: ${{ secrets[inputs.target == 'rehearsal' && 'REHEARSAL_VPS_TAILSCALE_HOST' || 'VPS_TAILSCALE_HOST'] }}
          VPS_SSH_USER: ${{ vars[inputs.target == 'rehearsal' && 'REHEARSAL_VPS_SSH_USER' || 'VPS_SSH_USER'] }}
          VPS_SSH_HOST_FINGERPRINT: ${{ secrets[inputs.target == 'rehearsal' && 'REHEARSAL_VPS_SSH_HOST_FINGERPRINT' || 'VPS_SSH_HOST_FINGERPRINT'] }}
          VPS_DEPLOY_SSH_KEY: ${{ secrets[inputs.target == 'rehearsal' && 'REHEARSAL_VPS_DEPLOY_SSH_KEY' || 'VPS_DEPLOY_SSH_KEY'] }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets[inputs.target == 'rehearsal' && 'REHEARSAL_VPS_SSH_KNOWN_HOSTS' || 'VPS_SSH_KNOWN_HOSTS'] }}
        run: |
          python3 scripts/portable-vps-day-role-stage-dispatch.py \
            --source-sha "$SOURCE_SHA" \
            --stage-id "$STAGE_ID" \
            --report "$RUNNER_TEMP/vps-day-role-stage-report.json"

      - name: Upload sanitized stage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vps-day-role-stage-report
          path: ${{ runner.temp }}/vps-day-role-stage-report.json
          if-no-files-found: ignore
          retention-days: 30
