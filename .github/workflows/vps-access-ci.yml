name: VPS access contract
on:
  pull_request:
    paths:
      - ".github/workflows/vps-access-*.yml"
      - "scripts/portable-vps-*.py"
      - "scripts/tests/test_portable_vps_access.py"
      - "scripts/tests/test_portable_vps_migration_baseline.py"
      - "scripts/tests/test_portable_vps_backup_evidence.py"
      - "scripts/tests/test_portable_vps_writer_pause_gate.py"
      - "scripts/tests/test_portable_vps_writer_docker.py"
      - "scripts/tests/test_portable_vps_release_pause_backup.py"
      - "scripts/tests/test_portable_vps_release_preflight.py"
      - "docs/operations/vps-github-access.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/vps-access-*.yml"
      - "scripts/portable-vps-*.py"
      - "scripts/tests/test_portable_vps_access.py"
      - "scripts/tests/test_portable_vps_migration_baseline.py"
      - "scripts/tests/test_portable_vps_backup_evidence.py"
      - "scripts/tests/test_portable_vps_writer_pause_gate.py"
      - "scripts/tests/test_portable_vps_writer_docker.py"
      - "scripts/tests/test_portable_vps_release_pause_backup.py"
      - "scripts/tests/test_portable_vps_release_preflight.py"
      - "docs/operations/vps-github-access.md"
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test fixed read-only SSH request and sanitized reporting
        run: python3 -m unittest discover -s scripts/tests -p test_portable_vps_access.py -v
      - name: Test exact live migration revision baseline without Docker writes
        run: python3 -m unittest discover -s scripts/tests -p test_portable_vps_migration_baseline.py -v
      - name: Test fresh same-copy backup and isolated restore evidence
        run: python3 -m unittest discover -s scripts/tests -p test_portable_vps_backup_evidence.py -v
      - name: Test read-only writer pause and backup ordering gate
        run: python3 -m unittest discover -s scripts/tests -p test_portable_vps_writer_pause_gate.py -v
      - name: Test confirmed pause and managed backup phases
        run: python3 -m unittest discover -s scripts/tests -p test_portable_vps_release_pause_backup.py -v
      - name: Test candidate-bound release preflight and baseline capture
        run: python3 -m unittest discover -s scripts/tests -p test_portable_vps_release_preflight.py -v
  docker-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise writer gate against disposable Docker containers
        run: sudo env VPS_WRITER_DOCKER_TEST=1 python3 -m unittest discover -s scripts/tests -p test_portable_vps_writer_docker.py -v
