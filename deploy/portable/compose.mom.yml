# Requires mom-bot's portable configuration support (v1.6.0 candidate or later).
x-mom: &mom
  image: ${MOM_IMAGE:?Set an immutable mom-bot image}
  env_file: ./runtime/mom.env
  environment:
    MOM_BOT_ENV: prod
    MOM_BOT_SECRET_SOURCE: environment
    MOM_BOT_DATABASE_AUTH: password
  networks: [application, database]
  mem_limit: 512m
  cpus: 0.5
  pids_limit: 128
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
services:
  backend:
    environment: {DISCORD_BOT_API_URL: "http://mom:8001"}
  migrate-siege:
    environment: {DISCORD_BOT_API_URL: "http://mom:8001"}
  mom:
    <<: *mom
    restart: unless-stopped
    init: true
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=4)); assert d['bot_connected']"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
  migrate-mom:
    <<: *mom
    profiles: [maintenance]
    restart: "no"
    # Clear any image entrypoint; invoke Alembic without Azure-only migrate.sh.
    entrypoint: []
    command: [/app/.venv/bin/alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
