name: VPS release read-only acceptance

# Observe the promoted candidate; credentials stay in private VPS files.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Protected deployment target
        required: true
        default: production
        type: choice
        options:
          - production
          - rehearsal
      manifest_sha256:
        description: SHA-256 of the exact candidate JSON staged on the VPS
        required: true
        type: string
      plan_sha256:
        description: SHA-256 of the accepted pause-plan.json from the plan report
        required: true
        type: string
      readiness_sha256:
        description: SHA-256 of the accepted migration-ready baseline
        required: true
        type: string
      promotion_ready_sha256:
        description: SHA-256 of the accepted promotion-ready baseline
        required: true
        type: string
      stage_run_id:
        description: Run ID and attempt of the successful VPS release stage (for example 123456-1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vps-production-promotion
  cancel-in-progress: false

jobs:
  accept:
    if: github.ref == 'refs/heads/main' && (inputs.target == 'production' || inputs.target == 'rehearsal')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.target == 'rehearsal' && 'vps-rehearsal' || 'vps-prod' }}
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Join tailnet as ephemeral deployment runner
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets[inputs.target == 'rehearsal' && 'REHEARSAL_TAILSCALE_OAUTH_CLIENT_ID' || 'TAILSCALE_OAUTH_CLIENT_ID'] }}
          oauth-secret: ${{ secrets[inputs.target == 'rehearsal' && 'REHEARSAL_TAILSCALE_OAUTH_SECRET' || 'TAILSCALE_OAUTH_SECRET'] }}
          tags: tag:github-deploy

      - name: Run read-only post-promotion acceptance
        env:
          VPS_TAILSCALE_HOST: ${{ secrets[inputs.target == 'rehearsal' && 'REHEARSAL_VPS_TAILSCALE_HOST' || 'VPS_TAILSCALE_HOST'] }}
          VPS_SSH_USER: ${{ vars[inputs.target == 'rehearsal' && 'REHEARSAL_VPS_SSH_USER' || 'VPS_SSH_USER'] }}
          VPS_SSH_HOST_FINGERPRINT: ${{ secrets[inputs.target == 'rehearsal' && 'REHEARSAL_VPS_SSH_HOST_FINGERPRINT' || 'VPS_SSH_HOST_FINGERPRINT'] }}
          VPS_DEPLOY_SSH_KEY: ${{ secrets[inputs.target == 'rehearsal' && 'REHEARSAL_VPS_DEPLOY_SSH_KEY' || 'VPS_DEPLOY_SSH_KEY'] }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets[inputs.target == 'rehearsal' && 'REHEARSAL_VPS_SSH_KNOWN_HOSTS' || 'VPS_SSH_KNOWN_HOSTS'] }}
          CANDIDATE_SHA256: ${{ inputs.manifest_sha256 }}
          STAGE_RUN_ID: ${{ inputs.stage_run_id }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          READINESS_SHA256: ${{ inputs.readiness_sha256 }}
          PROMOTION_SHA256: ${{ inputs.promotion_ready_sha256 }}
        run: |
          python3 scripts/portable-vps-release-accept-dispatch.py \
            --manifest-sha256 "$CANDIDATE_SHA256" \
            --stage-run-id "$STAGE_RUN_ID" \
            --plan-sha256 "$PLAN_SHA256" \
            --readiness-sha256 "$READINESS_SHA256" \
            --promotion-ready-sha256 "$PROMOTION_SHA256" \
            --report "$RUNNER_TEMP/vps-accept-dispatch-report.json"

      - name: Upload sanitized acceptance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vps-accept-dispatch-report
          path: ${{ runner.temp }}/vps-accept-dispatch-report.json
          if-no-files-found: ignore
          retention-days: 30
